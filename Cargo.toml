[package]
name = "pi-mobile-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A mobile-first, multi-session web interface for Pi Coding Agent"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
futures-util = "0.3"
mime_guess = "2.0"
rust-embed = "8.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
walkdir = "2.5"

[profile.release]
strip = true
